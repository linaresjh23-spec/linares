    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            font-family: Arial, sans-serif;
            text-align: center;

            background: linear-gradient(
                135deg,
                #ff416c,
                #ff4b8b,
                #ff758c
            );

            color: white;
        }

        /* Corazón principal */
        .heart {
            position: relative;

            width: 130px;
            height: 130px;

            background: #ff003c;

            transform: rotate(-45deg);

            animation: heartbeat 1.2s infinite;

            box-shadow:
                0 0 20px #ff003c,
                0 0 50px rgba(255, 0, 60, 0.7);
        }

        .heart::before,
        .heart::after {
            content: "";

            position: absolute;

            width: 130px;
            height: 130px;

            background: #ff003c;

            border-radius: 50%;
        }

        .heart::before {
            top: -65px;
            left: 0;
        }

        .heart::after {
            left: 65px;
            top: 0;
        }

        /* Latido */
        @keyframes heartbeat {

            0% {
                transform: rotate(-45deg) scale(1);
            }

            25% {
                transform: rotate(-45deg) scale(1.1);
            }

            40% {
                transform: rotate(-45deg) scale(1);
            }

            60% {
                transform: rotate(-45deg) scale(1.15);
            }

            100% {
                transform: rotate(-45deg) scale(1);
            }
        }

        h1 {
            margin-top: 80px;

            font-size: 42px;

            text-shadow:
                0 0 10px white,
                0 0 20px rgba(255,255,255,0.5);
        }

        p {
            margin-top: 15px;

            font-size: 20px;

            max-width: 80%;
        }

        /* Corazones flotantes */

        .floating-heart {
            position: absolute;

            bottom: -50px;

            font-size: 25px;

            animation: floating 6s linear infinite;

            opacity: 0.9;
        }

        @keyframes floating {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .heart1 {
            left: 5%;
            animation-delay: 0s;
        }

        .heart2 {
            left: 20%;
            animation-delay: 1s;
        }

        .heart3 {
            left: 40%;
            animation-delay: 2s;
        }

        .heart4 {
            left: 60%;
            animation-delay: 3s;
        }

        .heart5 {
            left: 80%;
            animation-delay: 4s;
        }

        .heart6 {
            left: 95%;
            animation-delay: 5s;
        }

        /* Botón */

        button {
            margin-top: 30px;

            padding: 14px 28px;

            border: none;
            border-radius: 30px;

            background: white;
            color: #ff1744;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 5px 20px rgba(0,0,0,0.2);

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        #mensaje {
            display: none;

            margin-top: 20px;

            font-size: 24px;
            font-weight: bold;

            animation: aparecer 1s ease;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>




    <!-- Corazón -->
    <div class="heart"></div>

    <!-- Cambia este texto por el nombre -->
    <h1>Para ti ❤️</h1>

    <!-- Cambia este mensaje -->
    <p>
        Hice esto especialmente para ti.
        Porque hay personas que merecen un corazón especial. 💕
    </p>

    <button onclick="mostrarMensaje()">
        💌 Presiona aquí
    </button>

    <div id="mensaje">
        Te quiero mucho ❤️🥰
    </div>

    <!-- Corazones flotantes -->
    <div class="floating-heart heart1">❤️</div>
    <div class="floating-heart heart2">💕</div>
    <div class="floating-heart heart3">💗</div>
    <div class="floating-heart heart4">❤️</div>
    <div class="floating-heart heart5">💖</div>
    <div class="floating-heart heart6">💕</div>

    <script>
        function mostrarMensaje() {

            document.getElementById("mensaje").style.display = "block";

        }
    </script>
